<!doctype html><html><head><title>Twitch</title></head><body>
<div id="player"><video></video></div>
<div class="channel-info-content" id="live-channel-stream-information">
  <h1 class="channel-name">streamer</h1>
  <h2 data-a-target="stream-title" id="title">Chill evening stream</h2>
  <div id="game-slot"></div>
</div>
<script>
  // Like Twitch: the category arrives after the page has loaded.
  const game = { retrogamer: 'Grand Theft Auto IV', rpstreamer: 'Grand Theft Auto V' }[location.pathname.slice(1)] || 'Minecraft';
  setTimeout(() => {
    document.title = location.pathname.slice(1) + ' - Twitch';
    const a = document.createElement('a');
    a.setAttribute('data-a-target', 'stream-game-link');
    a.href = '/directory/category/' + game.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    a.textContent = game;
    document.getElementById('game-slot').appendChild(a);
  }, 300);
</script>
</body></html>
