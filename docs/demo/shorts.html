<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shorts - DemoTube</title>
<!-- Mock Shorts feed used for the README screenshots. -->
<style>
  body { margin: 0; background: #0f0f0f; color: #fff; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #feed { display: flex; gap: 32px; justify-content: center; padding: 24px; }
  ytd-reel-video-renderer { display: block; width: 300px; height: 533px; border-radius: 16px; overflow: hidden; position: relative; }
  .video { position: absolute; inset: 0; }
  video { display: none; }
  .cap { position: absolute; left: 14px; right: 14px; bottom: 16px; font-weight: 600; text-shadow: 0 1px 3px #000; }
  .cap span { display: block; font-weight: 400; color: #ddd; margin-top: 4px; }
</style></head>
<body><div id="feed">
  <ytd-reel-video-renderer><div class="video" style="background:linear-gradient(160deg,#ff4fa3,#7b2ff7 60%,#1b1b3a)"></div><video></video>
    <div class="cap">Insane new leak 😱<span>#gta6 #leak</span></div></ytd-reel-video-renderer>
  <ytd-reel-video-renderer><div class="video" style="background:linear-gradient(160deg,#56ccf2,#2f80ed 60%,#10203a)"></div><video></video>
    <div class="cap">My cat learned a backflip<span>#cats #funny</span></div></ytd-reel-video-renderer>
</div></body></html>
